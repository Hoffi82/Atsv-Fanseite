name: Tippspiel Punkte aktualisieren
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.event.head_commit.message != 'Tippspiel Punkte auf 3-2-0 umgestellt'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Punkte auf 3-2-0 umstellen
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tippspiel.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('richtige Tendenz = 1 Punkt', 'richtige Tendenz = 2 Punkte')
          s=s.replace('richtige Tendenz = 1 Punkt', 'richtige Tendenz = 2 Punkte')
          s=s.replace('richtige Tendenz = 1 Punkt', 'richtige Tendenz = 2 Punkte')
          s=s.replace('return tipT===resT?1:0', 'return tipT===resT?2:0')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Änderungen speichern
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tippspiel.html
          git diff --cached --quiet && exit 0
          git commit -m 'Tippspiel Punkte auf 3-2-0 umgestellt'
          git push
      - name: Temporären Workflow entfernen
        if: success()
        run: |
          rm .github/workflows/tmp-tippspiel-punkte.yml
          git add .github/workflows/tmp-tippspiel-punkte.yml
          git commit -m 'Temporären Punkte-Workflow entfernen'
          git push
