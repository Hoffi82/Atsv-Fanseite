name: Fix Push Integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-push:
    if: ${{ !startsWith(github.event.head_commit.message, 'Auto-fix push integration') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove legacy inline push code and load the new script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          pattern = r'<script>\s*async function enablePushNotifications\(\).*?</script>'
          new_html, count = re.subn(pattern, '', html, count=1, flags=re.S)

          script_tag = '<script src="./js/script.js?v=17"></script>'
          if script_tag not in new_html:
              new_html = new_html.replace('</body>', f'{script_tag}\n</body>')

          if count == 0 and script_tag in html:
              print('No legacy block found; nothing to change.')
          else:
              path.write_text(new_html, encoding='utf-8')
              print(f'Legacy push blocks removed: {count}')
          PY

      - name: Make long result team names wrap cleanly
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('ergebnisse.html')
          html = path.read_text(encoding='utf-8')

          old = '.result-team{font-size:14px;font-weight:700}'
          new = '.result-team{font-size:14px;font-weight:700;overflow-wrap:anywhere;word-break:break-word;line-height:1.25;max-width:100%}'
          html = html.replace(old, new)
          path.write_text(html, encoding='utf-8')
          print('Result team names will wrap cleanly on small screens.')
          PY

      - name: Add permanent Push-Zentrale link to Live-Ticker admin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('live.html')
          html = path.read_text(encoding='utf-8')
          marker = '</div>\n<div class="ticker">'
          button = '<a href="admin-push.html" class="publish-button" style="display:block;text-align:center;text-decoration:none;box-sizing:border-box;">🔔 ATSV PUSH-ZENTRALE</a>\n'
          if 'href="admin-push.html"' not in html:
              if marker not in html:
                  raise SystemExit('Could not find the Live-Ticker admin end marker.')
              html = html.replace(marker, button + marker, 1)
              path.write_text(html, encoding='utf-8')
              print('Permanent Push-Zentrale link added to live.html.')
          else:
              print('Push-Zentrale link already present; nothing to change.')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ergebnisse.html live.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-fix push integration"
            git push
          fi
