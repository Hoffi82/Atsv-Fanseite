name: Fix Push Integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-push:
    if: ${{ !startsWith(github.event.head_commit.message, 'Auto-fix push integration') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove legacy inline push code and load the new script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          pattern = r'<script>\s*async function enablePushNotifications\(\).*?</script>'
          new_html, count = re.subn(pattern, '', html, count=1, flags=re.S)

          script_tag = '<script src="./js/script.js?v=17"></script>'
          if script_tag not in new_html:
              new_html = new_html.replace('</body>', f'{script_tag}\n</body>')

          if count == 0 and script_tag in html:
              print('No legacy block found; nothing to change.')
          else:
              path.write_text(new_html, encoding='utf-8')
              print(f'Legacy push blocks removed: {count}')
          PY

      - name: Make long result team names wrap cleanly
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('ergebnisse.html')
          html = path.read_text(encoding='utf-8')

          old = '.result-team{font-size:14px;font-weight:700}'
          new = '.result-team{font-size:14px;font-weight:700;overflow-wrap:anywhere;word-break:break-word;line-height:1.25;max-width:100%}'
          html = html.replace(old, new)
          path.write_text(html, encoding='utf-8')
          print('Result team names will wrap cleanly on small screens.')
          PY

      - name: Enforce table before results
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('ergebnisse.html')
          html = path.read_text(encoding='utf-8')
          marker = '</body>'
          fix = r'''<script>
          (function(){
            const c=document.querySelector('.results-container');
            if(!c) return;
            const subtitle=c.querySelector('.results-subtitle');
            const titles=c.querySelectorAll(':scope > .section-title');
            const table=c.querySelector(':scope > .table-wrapper');
            const legend=c.querySelector(':scope > .legend');
            const note=c.querySelector(':scope > .table-note');
            const matches=[...c.querySelectorAll(':scope > .matchday-box')];
            if(!subtitle || titles.length<2 || !table || !legend || !note || !matches.length) return;
            const tableTitle=titles[0], resultsTitle=titles[1];
            subtitle.after(tableTitle,table,legend,note,resultsTitle,...matches);
          })();
          </script>'''
          if 'Enforce table before results' not in html:
              html = html.replace(marker, fix + '\n' + marker, 1)
              path.write_text(html, encoding='utf-8')
              print('Table order enforcement added.')
          else:
              print('Table order enforcement already present.')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ergebnisse.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-fix push integration"
            git push
          fi
