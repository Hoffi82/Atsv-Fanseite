name: Fix Push Integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-push:
    if: ${{ !startsWith(github.event.head_commit.message, 'Auto-fix push integration') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove legacy inline push code and load the new script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          pattern = r'<script>\s*async function enablePushNotifications\(\).*?</script>'
          new_html, count = re.subn(pattern, '', html, count=1, flags=re.S)

          script_tag = '<script src="./js/script.js?v=17"></script>'
          if script_tag not in new_html:
              new_html = new_html.replace('</body>', f'{script_tag}\n</body>')

          if count == 0 and script_tag in html:
              print('No legacy block found; nothing to change.')
          else:
              path.write_text(new_html, encoding='utf-8')
              print(f'Legacy push blocks removed: {count}')
          PY

      - name: Make long result team names wrap cleanly
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('ergebnisse.html')
          html = path.read_text(encoding='utf-8')

          old = '.result-team{font-size:14px;font-weight:700}'
          new = '.result-team{font-size:14px;font-weight:700;overflow-wrap:anywhere;word-break:break-word;line-height:1.25;max-width:100%}'
          html = html.replace(old, new)
          path.write_text(html, encoding='utf-8')
          print('Result team names will wrap cleanly on small screens.')
          PY

      - name: Make home live ticker show every active live match
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('js/script.js')
          js = path.read_text(encoding='utf-8')
          old = '''  if (match?.created_at) {\n    const age = Date.now() - new Date(match.created_at).getTime();\n    if (age > 2 * 60 * 60 * 1000) match = null;\n  }\n'''
          if old in js:
              js = js.replace(old, '')
              path.write_text(js, encoding='utf-8')
              print('Removed the 2-hour stale-match filter from the homepage live ticker.')
          else:
              print('Stale-match filter already removed; nothing to do.')
          PY

      - name: Fix automatic live match minute
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('live.html')
          html = path.read_text(encoding='utf-8')
          html = html.replace(
              'status:"live",home_score:0,away_score:0,current_minute:1',
              'status:"live",home_score:0,away_score:0,current_minute:1,live_started_at:new Date().toISOString()'
          )
          helper = '''function calculatedLiveMinute(m){if(!m||m.status!=="live")return m?.current_minute??1;const start=m.live_started_at||m.updated_at||m.created_at;if(!start)return m.current_minute??1;return Math.max(1,Math.floor((Date.now()-new Date(start).getTime())/60000)+1)}\n'''
          if 'function calculatedLiveMinute(' not in html:
              html = html.replace('function updateScreen(){', helper + 'function updateScreen(){', 1)
          html = html.replace(
              'document.getElementById("currentMinute").textContent=currentMatch.current_minute??1;',
              'document.getElementById("currentMinute").textContent=calculatedLiveMinute(currentMatch);'
          )
          html = html.replace('checkAdminSession();', 'checkAdminSession();setInterval(loadActiveMatch,10000);')
          path.write_text(html, encoding='utf-8')

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          inject = '''<script>\n(async function(){const sb=window.supabase?.createClient?.("https://xmtrtpibldbiiikkkmnd.supabase.co","sb_publishable_5dbkLVYmSklCiPcjzzFk1g_ANJoqy9B");if(!sb)return;async function refreshHomeLiveMinute(){const{data}=await sb.from("live_matches").select("status,current_minute,live_started_at,updated_at,created_at").eq("status","live").order("created_at",{ascending:false}).limit(1).maybeSingle();if(!data)return;const start=data.live_started_at||data.updated_at||data.created_at;if(!start)return;const minute=Math.max(1,Math.floor((Date.now()-new Date(start).getTime())/60000)+1);const el=document.getElementById("liveCurrentMinute");if(el)el.textContent=minute+"'";}refreshHomeLiveMinute();setInterval(refreshHomeLiveMinute,10000);})();\n</script>\n'''
          if 'refreshHomeLiveMinute' not in html:
              html = html.replace('</body>', inject + '</body>', 1)
          path.write_text(html, encoding='utf-8')
          print('Automatic live minute calculation added.')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ergebnisse.html js/script.js live.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-fix push integration"
            git push
          fi
