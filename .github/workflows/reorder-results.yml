name: Reorder Results Page

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  reorder:
    if: ${{ !startsWith(github.event.head_commit.message, 'Reorder results table') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Move table above results
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('ergebnisse.html')
          html = path.read_text(encoding='utf-8')

          table_pattern = r'(<div class="section-title">🏆 Tabelle</div>.*?<div class="table-note">.*?</div>)'
          table_match = re.search(table_pattern, html, flags=re.S)
          if not table_match:
              raise SystemExit('Table block not found.')

          table_block = table_match.group(1)
          html_without_table = html[:table_match.start()] + html[table_match.end():]

          results_heading = '<div class="section-title">⚽ Ergebnisse</div>'
          if results_heading not in html_without_table:
              raise SystemExit('Results heading not found.')

          html_without_table = html_without_table.replace(
              results_heading,
              table_block + '\n' + results_heading,
              1
          )

          path.write_text(html_without_table, encoding='utf-8')
          print('Table moved above results. No other page content was intentionally changed.')
          PY

      - name: Commit reordered page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ergebnisse.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Reorder results table"
            git push
          fi
