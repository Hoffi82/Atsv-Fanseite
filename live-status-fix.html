<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ATSV Live-Status Reparatur</title><style>body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif;padding:25px}.box{max-width:600px;margin:auto;background:#111;border:2px solid #d00020;border-radius:16px;padding:24px}.title{color:#d00020;font-size:24px;font-weight:900;text-align:center}.match{background:#181818;border-radius:10px;padding:18px;margin:20px 0;text-align:center}.button{width:100%;padding:14px;border:0;border-radius:9px;background:#d00020;color:#fff;font-weight:900;font-size:16px;cursor:pointer;margin-top:10px}.green{background:#0b5d2a}.msg{text-align:center;color:#aaa;margin-top:15px}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="box"><div class="title">🔧 ATSV LIVE-STATUS</div><p>Diese Seite ist nur für die Reparatur eines hängen gebliebenen Live-Spiels gedacht.</p><div id="match" class="match">Wird geladen...</div><button class="button green" onclick="finishMatch()">🏁 SPIEL SAUBER BEENDEN</button><button class="button" onclick="location.href='live.html'">← ZURÜCK ZUM LIVETICKER</button><div id="msg" class="msg"></div></div><script>const sb=window.supabase.createClient('https://xmtrtpibldbiiikkkmnd.supabase.co','sb_publishable_5dbkLVYmSklCiPcjzzFk1g_ANJoqy9B');let match=null;async function load(){const s=await sb.auth.getSession();if(!s.data.session){document.getElementById('match').textContent='Bitte zuerst im Live-Ticker als Admin anmelden und diese Seite danach öffnen.';return}const r=await sb.from('live_matches').select('*').eq('status','live').order('created_at',{ascending:false}).limit(1).maybeSingle();if(r.error){document.getElementById('match').textContent='Fehler beim Laden: '+r.error.message;return}match=r.data;if(!match){document.getElementById('match').textContent='Kein LIVE-Spiel gefunden. Der Status ist bereits sauber.';return}document.getElementById('match').innerHTML='<strong>'+match.home_team+' – '+match.away_team+'</strong><br><br><span style="font-size:30px;color:#d00020">'+(match.home_score??0)+' : '+(match.away_score??0)+'</span><br><br>Status: LIVE';}async function finishMatch(){if(!match){await load();if(!match)return}if(!confirm('Dieses Spiel wirklich als beendet markieren? Der Spielstand und die Ereignisse bleiben erhalten.'))return;const minute=match.current_minute??1;let r=await sb.from('live_matches').update({status:'final',current_minute:minute}).eq('id',match.id).select().single();if(r.error){document.getElementById('msg').textContent='Fehler: '+r.error.message;return}match=r.data;document.getElementById('match').innerHTML='<strong>'+match.home_team+' – '+match.away_team+'</strong><br><br><span style="font-size:30px;color:#d00020">'+(match.home_score??0)+' : '+(match.away_score??0)+'</span><br><br>Status: ABGEPFIFF 🏁';document.getElementById('msg').textContent='Spiel sauber beendet. Spielstand und Ereignisse wurden nicht verändert.'}load();</script></body></html>
