<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATSV Test-Live-Ticker</title><style>body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:650px;margin:auto;padding:30px 18px}.card{background:#111;border:2px solid #d00020;border-radius:16px;padding:25px;text-align:center}.badge{display:inline-block;padding:9px 16px;border-radius:20px;background:#6b4a00;font-weight:900}.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:15px;align-items:center;margin:25px 0}.team{font-weight:900;font-size:20px}.score{font-size:48px;font-weight:900;color:#d00020}.minute{font-size:20px;margin:15px}.events{margin-top:20px;text-align:left}.event{background:#191919;padding:12px;margin:8px 0;border-left:4px solid #d00020}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.btn{border:0;border-radius:9px;padding:14px;font-weight:900;color:#fff;background:#222;cursor:pointer}.start{background:#0b5d2a}.goal{background:#d00020}.final{background:#6b4a00}.reset{background:#6b0010}.note{color:#aaa;margin-top:18px;font-size:14px}</style></head><body><div class="wrap"><div class="card"><h1>🧪 ATSV TEST-LIVE-TICKER</h1><div id="badge" class="badge">BEREIT</div><div class="teams"><div class="team">ATSV Forchheim</div><div id="score" class="score">0 : 0</div><div class="team">TESTGEGNER</div></div><div class="minute">Spielminute: <strong id="minute">-</strong>'</div><div id="events" class="events"></div><div class="buttons"><button class="btn start" onclick="startTest()">🔴 TEST STARTEN</button><button class="btn goal" onclick="goal()">⚽ TESTTOR ATSV</button><button class="btn final" onclick="finishTest()">🏁 TEST-ABPFIFF</button><button class="btn reset" onclick="resetTest()">🔄 ZURÜCKSETZEN</button></div><div class="note">Dieser Test läuft ausschließlich im Browser. Es werden keine echten Spiele, Supabase-Daten oder Ergebnisse verändert.</div></div></div><script>let running=false,start=0,home=0,timer=null;function render(){document.getElementById('minute').textContent=running?Math.floor((Date.now()-start)/60000)+1:'-';document.getElementById('score').textContent=home+' : 0';document.getElementById('badge').textContent=running?'🧪 TEST LÄUFT':'BEREIT';}function startTest(){if(running)return;running=true;start=Date.now();home=0;document.getElementById('events').innerHTML='<div class="event">1\' Anpfiff – Testspiel läuft.</div>';clearInterval(timer);timer=setInterval(render,1000);render()}function goal(){if(!running){alert('Bitte zuerst TEST STARTEN.');return}home++;const m=Math.floor((Date.now()-start)/60000)+1;document.getElementById('events').insertAdjacentHTML('afterbegin','<div class="event">'+m+'\' ⚽ TOR FÜR DEN ATSV!</div>');render()}function finishTest(){if(!running){alert('Kein Test läuft.');return}const m=Math.floor((Date.now()-start)/60000)+1;document.getElementById('events').insertAdjacentHTML('afterbegin','<div class="event">'+m+'\' 🏁 Abpfiff – Test beendet.</div>');running=false;clearInterval(timer);timer=null;render()}function resetTest(){running=false;clearInterval(timer);timer=null;home=0;document.getElementById('events').innerHTML='';render()}</script></body></html>
