<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://xmtrtpibldbiiikkkmnd.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_5dbkLVYmSklCiPcjzzFk1g_ANJoqy9B";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* =========================================
   VARIABLEN
========================================= */

let leagueTeams = [];

let finishedMatches = [];



/* =========================================
   HILFSFUNKTION
========================================= */

function cleanTeamName(name) {

    return String(name || "")
        .replace(/\s+/g, " ")
        .trim();

}



function isATSV(name) {

    return cleanTeamName(name)
        .toLowerCase()
        .includes("atsv");

}



function formatDate(value) {

    if (!value) {

        return "";

    }


    /*
       Datum aus dem Spielplan:
       09.08.2026
    */

    if (
        /^\d{2}\.\d{2}\.\d{4}$/
            .test(value)
    ) {

        return value;

    }


    const date =
        new Date(value);


    if (
        isNaN(date.getTime())
    ) {

        return value;

    }


    return date.toLocaleDateString(
        "de-DE",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        }
    );

}



/* =========================================
   LIGA VEREINE LADEN
========================================= */

async function loadLeagueTeams() {

    try {

        const response =
            await fetch(
                "liga-26-27.html"
            );


        if (!response.ok) {

            throw new Error(
                "Liga-Datei konnte nicht geladen werden."
            );

        }


        const html =
            await response.text();


        const parser =
            new DOMParser();


        const doc =
            parser.parseFromString(
                html,
                "text/html"
            );


        const cards =
            doc.querySelectorAll(
                ".match-card"
            );


        const teams =
            new Set();


        cards.forEach(card => {


            const home =
                card.querySelector(
                    ".teams .home"
                );


            const away =
                card.querySelector(
                    ".teams .away"
                );


            if (home) {

                teams.add(
                    cleanTeamName(
                        home.textContent
                    )
                );

            }


            if (away) {

                teams.add(
                    cleanTeamName(
                        away.textContent
                    )
                );

            }

        });


        leagueTeams =
            Array.from(teams);


        console.log(
            "Liga-Vereine:",
            leagueTeams
        );


    } catch (error) {

        console.error(
            "Fehler beim Laden der Liga:",
            error
        );


        leagueTeams = [];

    }

}



/* =========================================
   ERGEBNISSE AUS DEM OFFIZIELLEN SPIELPLAN
========================================= */

async function loadScheduleResults() {

    try {

        const response =
            await fetch(
                "liga-26-27.html"
            );


        if (!response.ok) {

            throw new Error(
                "Spielplan konnte nicht geladen werden."
            );

        }


        const html =
            await response.text();


        const parser =
            new DOMParser();


        const doc =
            parser.parseFromString(
                html,
                "text/html"
            );


        const cards =
            doc.querySelectorAll(
                ".match-card"
            );


        const results = [];


        cards.forEach(card => {


            const home =
                card.querySelector(
                    ".teams .home"
                );


            const away =
                card.querySelector(
                    ".teams .away"
                );


            const score =
                card.querySelector(
                    ".result .played"
                );


            const date =
                card.querySelector(
                    ".match-date strong"
                );


            if (
                !home ||
                !away ||
                !score
            ) {

                return;

            }


            const homeTeam =
                cleanTeamName(
                    home.textContent
                );


            const awayTeam =
                cleanTeamName(
                    away.textContent
                );


            /*
               SICHERHEIT:
               Beide Mannschaften müssen
               zur Liga gehören.
            */

            if (
                !leagueTeams.includes(
                    homeTeam
                )
                ||
                !leagueTeams.includes(
                    awayTeam
                )
            ) {

                return;

            }


            const scoreText =
                score.textContent.trim();


            if (
                !scoreText.includes(":")
            ) {

                return;

            }


            const parts =
                scoreText.split(":");


            if (
                parts.length !== 2
            ) {

                return;

            }


            const homeScore =
                parseInt(
                    parts[0].trim(),
                    10
                );


            const awayScore =
                parseInt(
                    parts[1].trim(),
                    10
                );


            if (
                isNaN(homeScore)
                ||
                isNaN(awayScore)
            ) {

                return;

            }


            results.push({

                home_team:
                    homeTeam,

                away_team:
                    awayTeam,

                home_score:
                    homeScore,

                away_score:
                    awayScore,

                created_at:
                    date
                    ? date.textContent.trim()
                    : ""

            });

        });


        return results;


    } catch (error) {

        console.error(
            "Fehler beim Spielplan:",
            error
        );


        return [];

    }

}



/* =========================================
   ERGEBNISSE AUS LIVETICKER
========================================= */

async function loadLiveResults() {

    try {

        const {
            data: matches,
            error: matchError
        } =
            await supabaseClient
                .from("live_matches")
                .select("*")
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        if (matchError) {

            throw matchError;

        }


        const {
            data: finalEvents,
            error: eventError
        } =
            await supabaseClient
                .from("live_events")
                .select("match_id")
                .eq(
                    "event_type",
                    "final"
                );


        if (eventError) {

            throw eventError;

        }


        const finishedIds =
            new Set(
                (finalEvents || [])
                    .map(
                        event =>
                            event.match_id
                    )
            );


        /*
           NUR echte Ligaspiele übernehmen.
        */

        return (matches || [])
            .filter(match => {


                if (
                    !finishedIds.has(
                        match.id
                    )
                ) {

                    return false;

                }


                const home =
                    cleanTeamName(
                        match.home_team
                    );


                const away =
                    cleanTeamName(
                        match.away_team
                    );


                /*
                   TEST GEGNER und
                   andere Testspielgegner
                   werden hier ausgeschlossen.
                */

                if (
                    !leagueTeams.includes(
                        home
                    )
                    ||
                    !leagueTeams.includes(
                        away
                    )
                ) {

                    return false;

                }


                return true;

            });


    } catch (error) {

        console.error(
            "Fehler beim Liveticker:",
            error
        );


        return [];

    }

}



/* =========================================
   ERGEBNISSE ZUSAMMENFÜHREN
========================================= */

function mergeResults(
    scheduleResults,
    liveResults
) {

    const combined = [];


    /*
       Zuerst die Ergebnisse aus
       dem offiziellen Spielplan.
    */

    scheduleResults.forEach(
        result => {

            combined.push(
                result
            );

        }
    );


    /*
       Danach Liveticker-Ergebnisse.
       Doppelte Spiele werden verhindert.
    */

    liveResults.forEach(
        result => {


            const duplicate =
                combined.some(
                    existing => {


                        return (

                            cleanTeamName(
                                existing.home_team
                            )
                            ===
                            cleanTeamName(
                                result.home_team
                            )

                            &&

                            cleanTeamName(
                                existing.away_team
                            )
                            ===
                            cleanTeamName(
                                result.away_team
                            )

                        );

                    }
                );


            if (!duplicate) {

                combined.push(
                    result
                );

            }

        }
    );


    return combined;

}



/* =========================================
   ERGEBNISSE ANZEIGEN
========================================= */

function renderResults() {

    const container =
        document.getElementById(
            "resultsList"
        );


    if (
        !finishedMatches.length
    ) {

        container.innerHTML =

            `
            <div class="empty-state">

                Noch keine Ergebnisse
                vorhanden.

            </div>
            `;

        return;

    }


    container.innerHTML =

        finishedMatches
            .map(match => {


                const home =
                    Number(
                        match.home_score
                    );


                const away =
                    Number(
                        match.away_score
                    );


                const atsvHome =
                    isATSV(
                        match.home_team
                    );


                const atsvAway =
                    isATSV(
                        match.away_team
                    );


                let status =
                    "";


                let statusClass =
                    "";


                if (
                    atsvHome
                    ||
                    atsvAway
                ) {


                    let atsvScore;


                    let opponentScore;


                    if (atsvHome) {

                        atsvScore =
                            home;

                        opponentScore =
                            away;

                    } else {

                        atsvScore =
                            away;

                        opponentScore =
                            home;

                    }


                    if (
                        atsvScore
                        >
                        opponentScore
                    ) {

                        status =
                            "Sieg";

                        statusClass =
                            "sieg";

                    }

                    else if (
                        atsvScore
                        <
                        opponentScore
                    ) {

                        status =
                            "Niederlage";

                        statusClass =
                            "niederlage";

                    }

                    else {

                        status =
                            "Unentschieden";

                        statusClass =
                            "unentschieden";

                    }

                }


                return `

                <article
                    class="result-card"
                >

                    <div
                        class="result-date"
                    >

                        ${formatDate(
                            match.created_at
                        )}

                    </div>


                    <div
                        class="result-teams"
                    >

                        <div
                            class="result-team"
                        >

                            ${cleanTeamName(
                                match.home_team
                            )}

                        </div>


                        <div
                            class="result-score"
                        >

                            ${home}:${away}

                        </div>


                        <div
                            class="result-team away"
                        >

                            ${cleanTeamName(
                                match.away_team
                            )}

                        </div>

                    </div>


                    ${
                        status
                        ?
                        `
                        <span
                            class="result-status
                            ${statusClass}"
                        >

                            ${status}

                        </span>
                        `
                        :
                        ""
                    }

                </article>

                `;

            })
            .join("");

}



/* =========================================
   TABELLE BERECHNEN
========================================= */

function calculateTable() {

    const table = {};


    /*
       ALLE Vereine der Liga anlegen.
       Dadurch erscheinen auch Vereine
       mit 0 Spielen.
    */

    leagueTeams.forEach(
        team => {


            table[team] = {

                team:
                    team,

                games:
                    0,

                wins:
                    0,

                draws:
                    0,

                losses:
                    0,

                goalsFor:
                    0,

                goalsAgainst:
                    0,

                points:
                    0

            };

        }
    );


    /*
       Nur echte Ligaspiele
       auswerten.
    */

    finishedMatches.forEach(
        match => {


            const home =
                cleanTeamName(
                    match.home_team
                );


            const away =
                cleanTeamName(
                    match.away_team
                );


            /*
               Zusätzliche Sicherheit:
               Fremde Mannschaften werden
               nicht in die Tabelle aufgenommen.
            */

            if (
                !leagueTeams.includes(
                    home
                )
                ||
                !leagueTeams.includes(
                    away
                )
            ) {

                return;

            }


            const homeScore =
                Number(
                    match.home_score
                );


            const awayScore =
                Number(
                    match.away_score
                );


            table[home].games++;

            table[away].games++;


            table[home].goalsFor +=
                homeScore;

            table[home].goalsAgainst +=
                awayScore;


            table[away].goalsFor +=
                awayScore;

            table[away].goalsAgainst +=
                homeScore;


            if (
                homeScore
                >
                awayScore
            ) {


                table[home].wins++;

                table[home].points += 3;

                table[away].losses++;


            }

            else if (
                homeScore
                <
                awayScore
            ) {


                table[away].wins++;

                table[away].points += 3;

                table[home].losses++;


            }

            else {


                table[home].draws++;

                table[away].draws++;


                table[home].points++;

                table[away].points++;

            }

        }
    );


    /*
       Tabelle sortieren:
       1. Punkte
       2. Tordifferenz
       3. erzielte Tore
    */

    return Object.values(table)
        .sort(
            (a, b) => {


                if (
                    b.points
                    !==
                    a.points
                ) {

                    return (
                        b.points
                        -
                        a.points
                    );

                }


                const diffA =
                    a.goalsFor
                    -
                    a.goalsAgainst;


                const diffB =
                    b.goalsFor
                    -
                    b.goalsAgainst;


                if (
                    diffB
                    !==
                    diffA
                ) {

                    return (
                        diffB
                        -
                        diffA
                    );

                }


                return (
                    b.goalsFor
                    -
                    a.goalsFor
                );

            }
        );

}



/* =========================================
   TABELLE ANZEIGEN
========================================= */

function renderTable() {

    const body =
        document.getElementById(
            "tableBody"
        );


    const table =
        calculateTable();


    if (
        !table.length
    ) {

        body.innerHTML =

            `
            <tr>

                <td colspan="9">

                    Keine Vereine gefunden.

                </td>

            </tr>
            `;

        return;

    }


    body.innerHTML =

        table
            .map(
                (club, index) => {


                    const diff =
                        club.goalsFor
                        -
                        club.goalsAgainst;


                    const atsV =
                        isATSV(
                            club.team
                        );


                    return `

                    <tr
                        class="${
                            atsV
                            ? "atsv-row"
                            : ""
                        }"
                    >


                        <td
                            class="position"
                        >

                            ${index + 1}

                        </td>


                        <td
                            class="team-name"
                        >

                            ${
                                atsV
                                ? "🔴 "
                                : ""
                            }

                            ${club.team}

                        </td>


                        <td>

                            ${club.games}

                        </td>


                        <td>

                            ${club.wins}

                        </td>


                        <td>

                            ${club.draws}

                        </td>


                        <td>

                            ${club.losses}

                        </td>


                        <td>

                            ${club.goalsFor}
                            :
                            ${club.goalsAgainst}

                        </td>


                        <td>

                            ${
                                diff > 0
                                ? "+" + diff
                                : diff
                            }

                        </td>


                        <td
                            class="points"
                        >

                            ${club.points}

                        </td>


                    </tr>

                    `;

                }
            )
            .join("");

}



/* =========================================
   SEITE STARTEN
========================================= */

async function initResultsPage() {

    try {


        /*
           1. Vereine aus der Liga laden
        */

        await loadLeagueTeams();


        /*
           Wenn keine Vereine gefunden
           wurden, abbrechen.
        */

        if (
            leagueTeams.length === 0
        ) {

            document.getElementById(
                "resultsList"
            ).innerHTML =

                `
                <div class="error-state">

                    Die Liga konnte nicht
                    geladen werden.

                </div>
                `;


            document.getElementById(
                "tableBody"
            ).innerHTML =

                `
                <tr>

                    <td colspan="9">

                        Liga konnte nicht
                        geladen werden.

                    </td>

                </tr>
                `;


            return;

        }


        /*
           2. Offizielle Ergebnisse laden
        */

        const scheduleResults =
            await loadScheduleResults();


        /*
           3. Liveticker-Ergebnisse laden
        */

        const liveResults =
            await loadLiveResults();


        /*
           4. Zusammenführen
        */

        finishedMatches =
            mergeResults(
                scheduleResults,
                liveResults
            );


        /*
           5. Neueste Spiele zuerst
        */

        finishedMatches.sort(
            (a, b) => {


                const dateA =
                    new Date(
                        a.created_at
                    );


                const dateB =
                    new Date(
                        b.created_at
                    );


                if (
                    isNaN(
                        dateA.getTime()
                    )
                ) {

                    return 1;

                }


                if (
                    isNaN(
                        dateB.getTime()
                    )
                ) {

                    return -1;

                }


                return (
                    dateB
                    -
                    dateA
                );

            }
        );


        /*
           6. Anzeigen
        */

        renderResults();

        renderTable();


    }

    catch (error) {


        console.error(
            "Fehler auf Ergebnisse-Seite:",
            error
        );


        document.getElementById(
            "resultsList"
        ).innerHTML =

            `
            <div class="error-state">

                Die Ergebnisse konnten
                nicht geladen werden.

            </div>
            `;


        document.getElementById(
            "tableBody"
        ).innerHTML =

            `
            <tr>

                <td colspan="9">

                    Fehler beim Laden
                    der Tabelle.

                </td>

            </tr>
            `;

    }

}



/* =========================================
   START
========================================= */

initResultsPage();

</script>
