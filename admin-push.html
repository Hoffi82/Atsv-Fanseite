<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#d00020">
  <title>ATSV Push-Zentrale</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#0b0b0b;color:#fff;font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{width:min(620px,100%);background:#151515;border:2px solid #d00020;border-radius:18px;padding:28px;box-shadow:0 0 30px rgba(208,0,32,.22)}
    .logo{display:block;width:75px;height:75px;object-fit:contain;margin:0 auto 12px}
    h1{text-align:center;color:#d00020;margin:0 0 6px;font-size:25px}
    .sub{text-align:center;color:#aaa;margin:0 0 25px}
    label{display:block;font-weight:800;margin:16px 0 7px}
    input,textarea{width:100%;background:#0d0d0d;color:#fff;border:1px solid #444;border-radius:9px;padding:12px;font-size:15px;outline:none}
    input:focus,textarea:focus{border-color:#d00020}
    textarea{min-height:130px;resize:vertical}
    button{width:100%;margin-top:20px;background:#d00020;color:#fff;border:0;border-radius:10px;padding:14px;font-size:16px;font-weight:900;cursor:pointer}
    button:hover{background:#a80019}
    button.secondary{background:#333;margin-top:10px}
    button.secondary:hover{background:#444}
    button:disabled{opacity:.65;cursor:wait}
    .status{margin-top:16px;padding:12px;border-radius:9px;text-align:center;font-weight:800;display:none}
    .status.ok{display:block;background:#123d1b;color:#8ff0a4;border:1px solid #2d8a42}
    .status.error{display:block;background:#3d1218;color:#ff9aa7;border:1px solid #a52a3b}
    .back{display:block;text-align:center;margin-top:18px;color:#aaa;text-decoration:none}
    .back:hover{color:#fff}
    .hint{font-size:12px;color:#777;margin-top:8px;text-align:center}
    .option{margin-top:14px;padding:12px;background:#0d0d0d;border:1px solid #333;border-radius:9px;color:#ccc;font-size:13px;line-height:1.45}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="bilder/ATSV_Wappen_4K_transparent.png" alt="ATSV Forchheim">
    <h1>🔔 ATSV Push-Zentrale</h1>
    <p class="sub">Nachricht schreiben, als News speichern und Push versenden</p>

    <form id="pushForm">
      <label for="password">Admin-Passwort</label>
      <input id="password" type="password" autocomplete="current-password" required placeholder="Admin-Passwort eingeben">

      <label for="title">Überschrift</label>
      <input id="title" maxlength="80" required placeholder="z. B. ATSV gewinnt!">

      <label for="body">Nachricht</label>
      <textarea id="body" maxlength="300" required placeholder="Deine Nachricht ..."></textarea>

      <label for="url">Link (optional)</label>
      <input id="url" type="url" placeholder="Wird automatisch auf die passende News gesetzt">

      <div class="option">
        📰 Die Nachricht wird zuerst unter <strong>News</strong> gespeichert. Anschließend wird der Push mit einem direkten Link zu dieser News verschickt.
      </div>

      <button id="sendButton" type="submit">📰 SPEICHERN &amp; 🔔 PUSH SENDEN</button>
      <button id="newsOnlyButton" class="secondary" type="button">📰 NUR ALS NEWS SPEICHERN</button>
    </form>

    <div id="status" class="status"></div>
    <a class="back" href="index.html">← Zurück zur Fanseite</a>
    <div class="hint">Der private VAPID-Schlüssel bleibt ausschließlich in Supabase.</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://xmtrtpibldbiiikkkmnd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_5dbkLVYmSklCiPcjzzFk1g_ANJoqy9B";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById("pushForm");
    const sendButton = document.getElementById("sendButton");
    const newsOnlyButton = document.getElementById("newsOnlyButton");
    const status = document.getElementById("status");

    function getValues() {
      return {
        password: document.getElementById("password").value,
        title: document.getElementById("title").value.trim(),
        body: document.getElementById("body").value.trim(),
        url: document.getElementById("url").value.trim()
      };
    }

    function today() {
      return new Date().toISOString().slice(0, 10);
    }

    async function saveNews(values) {
      const { data, error } = await supabaseClient
        .from("news")
        .insert({
          title: values.title,
          text: values.body,
          date: today()
        })
        .select("title, text, date")
        .single();

      if (error) throw new Error(`News konnte nicht gespeichert werden: ${error.message}`);
      return data;
    }

    async function sendPush(values, newsUrl) {
      const response = await fetch(`${SUPABASE_URL}/functions/v1/send-push`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY
        },
        body: JSON.stringify({
          adminPassword: values.password,
          title: values.title,
          body: values.body,
          url: newsUrl || values.url || "https://hoffi82.github.io/Atsv-Fanseite/news.html"
        })
      });

      const result = await response.json();
      if (!response.ok || !result.success) {
        throw new Error(result.error || `HTTP ${response.status}`);
      }
      return result;
    }

    function showStatus(type, text) {
      status.className = `status ${type}`;
      status.textContent = text;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const values = getValues();
      if (!values.password || !values.title || !values.body) return;

      sendButton.disabled = true;
      newsOnlyButton.disabled = true;
      showStatus("", "");
      sendButton.textContent = "⏳ NEWS WIRD GESPEICHERT...";

      try {
        // Erst News speichern, damit die Push-Nachricht immer auf eine vorhandene News zeigt.
        await saveNews(values);
        const newsUrl = values.url || `https://hoffi82.github.io/Atsv-Fanseite/news.html?title=${encodeURIComponent(values.title)}`;
        const result = await sendPush(values, newsUrl);
        showStatus("ok", `✅ News gespeichert und Push erfolgreich an ${result.sent} Gerät(e) gesendet.`);
        form.reset();
      } catch (error) {
        showStatus("error", `❌ ${error.message}`);
      } finally {
        sendButton.disabled = false;
        newsOnlyButton.disabled = false;
        sendButton.textContent = "📰 SPEICHERN & 🔔 PUSH SENDEN";
      }
    });

    newsOnlyButton.addEventListener("click", async () => {
      const values = getValues();
      if (!values.password || !values.title || !values.body) {
        showStatus("error", "❌ Bitte Admin-Passwort, Überschrift und Nachricht ausfüllen.");
        return;
      }

      newsOnlyButton.disabled = true;
      sendButton.disabled = true;
      newsOnlyButton.textContent = "⏳ NEWS WIRD GESPEICHERT...";

      try {
        // Das Passwort wird hier nur als einfacher Admin-Schutz für die Eingabemaske verwendet.
        // Die eigentliche Push-Authentifizierung findet weiterhin in der Edge Function statt.
        await saveNews(values);
        showStatus("ok", "✅ News erfolgreich gespeichert – kein Push versendet.");
        form.reset();
      } catch (error) {
        showStatus("error", `❌ ${error.message}`);
      } finally {
        newsOnlyButton.disabled = false;
        sendButton.disabled = false;
        newsOnlyButton.textContent = "📰 NUR ALS NEWS SPEICHERN";
      }
    });
  </script>
</body>
</html>
