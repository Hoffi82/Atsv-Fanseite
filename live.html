<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATSV Live-Ticker</title>
<style>
body{margin:0;background:#090909;color:#fff;font-family:Arial,Helvetica,sans-serif}.live-page{min-height:100vh;padding:30px 20px 100px;background:linear-gradient(135deg,#090909 0%,#151515 65%,#250b0b 100%)}.live-container{width:min(700px,100%);margin:0 auto}.live-title{text-align:center;color:#d00020;font-weight:900;letter-spacing:4px;text-transform:uppercase;margin-bottom:10px}.live-subtitle{text-align:center;color:#aaa;margin-bottom:25px}.score-card{background:#111;border:2px solid #d00020;border-radius:16px;padding:25px 18px;text-align:center;box-shadow:0 0 25px rgba(208,0,32,.25)}.live-badge{display:inline-block;background:#d00020;color:#fff;padding:7px 16px;border-radius:20px;font-size:12px;font-weight:bold;letter-spacing:2px;margin-bottom:18px}.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}.team-box{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}.team-logo{width:78px;height:78px;object-fit:contain;border-radius:6px}.team-logo.hidden{display:none}.team-placeholder{width:78px;height:78px;display:flex;align-items:center;justify-content:center;color:#777;font-size:38px}.team-placeholder.hidden{display:none}.team{font-size:20px;font-weight:900;line-height:1.15}.score{font-size:48px;font-weight:900;color:#d00020;white-space:nowrap}.minute{margin-top:10px;color:#aaa;font-size:14px}.admin-card{margin-top:25px;background:#111;border:1px solid #333;border-radius:16px;padding:22px}.admin-title{color:#d00020;font-weight:900;letter-spacing:2px;text-transform:uppercase;margin-bottom:18px}.admin-card input,.admin-card select{width:100%;box-sizing:border-box;padding:13px;margin:5px 0;background:#080808;color:#fff;border:1px solid #444;border-radius:8px;font-size:16px}.event-buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.event-button{border:1px solid #444;background:#181818;color:#fff;padding:16px 10px;border-radius:10px;font-weight:800;cursor:pointer}.event-button:hover{background:#d00020;border-color:#d00020}.event-form{display:none;margin-top:20px;padding-top:20px;border-top:1px solid #333}.event-form.active{display:block}.event-form label{display:block;color:#aaa;font-size:13px;margin:12px 0 6px}.publish-button{width:100%;margin-top:18px;padding:15px;background:#d00020;color:#fff;border:0;border-radius:9px;font-weight:900;cursor:pointer}.ticker{margin-top:25px}.ticker-title{color:#d00020;font-weight:900;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px}.ticker-event{background:#111;border-left:4px solid #d00020;padding:14px;margin-bottom:8px;border-radius:0 8px 8px 0}.ticker-minute{color:#d00020;font-weight:900;margin-right:8px}.back-button{display:block;width:fit-content;margin:25px auto 0;color:#fff;text-decoration:none;border:1px solid #444;padding:11px 18px;text-transform:uppercase;font-size:12px;font-weight:800}@media(max-width:600px){.live-page{padding:20px 12px 100px}.teams{grid-template-columns:1fr auto 1fr;gap:5px}.team{font-size:15px}.team-logo,.team-placeholder{width:60px;height:60px}.score{font-size:40px}.event-buttons{grid-template-columns:1fr}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="live-page"><div class="live-container">
<div class="live-title">ATSV Forchheim</div><div class="live-subtitle">🔴 Live-Ticker</div>
<div class="score-card">
<div class="live-badge" id="liveBadge">LIVE</div>
<div class="teams">
<div class="team-box"><img id="homeLogo" class="team-logo hidden" alt=""><div id="homePlaceholder" class="team-placeholder">⚽</div><div id="homeTeam" class="team">ATSV Forchheim</div></div>
<div class="score"><span id="homeScore">0</span> : <span id="awayScore">0</span></div>
<div class="team-box"><img id="awayLogo" class="team-logo hidden" alt=""><div id="awayPlaceholder" class="team-placeholder">⚽</div><div id="awayTeam" class="team">Gegner</div></div>
</div><div class="minute">Spielminute: <strong id="currentMinute">1</strong>'</div></div>
<div class="admin-card" id="loginPanel" style="display:block"><div class="admin-title">🔐 Admin-Anmeldung</div><input type="email" id="adminEmail" placeholder="E-Mail"><input type="password" id="adminPassword" placeholder="Passwort"><button class="publish-button" onclick="loginAdmin()">🔐 ANMELDEN</button><div id="loginMessage"></div></div>
<div class="admin-card" id="adminPanel" style="display:none"><div class="admin-title">🔐 ATSV Live-Eingabe</div>
<div class="admin-card"><div class="admin-title">📰 NEWS VERWALTEN</div><label>Überschrift</label><input type="text" id="newsTitle" placeholder="Überschrift der News"><label>Nachricht</label><input type="text" id="newsText" placeholder="Text der News"><label>Datum</label><input type="date" id="newsDate"><button class="publish-button" onclick="publishNews()">📰 NEWS VERÖFFENTLICHEN</button><div id="newsMessage"></div></div>
<div class="event-buttons"><button id="homeGoalButton" class="event-button" onclick="openEvent('homeGoal')">⚽ TOR HEIMTEAM</button><button id="awayGoalButton" class="event-button" onclick="openEvent('awayGoal')">⚽ TOR GASTTEAM</button><button class="event-button" onclick="openEvent('yellow')">🟨 GELBE KARTE</button><button class="event-button" onclick="openEvent('red')">🟥 ROTE KARTE</button><button class="event-button" onclick="openEvent('substitution')">🔄 WECHSEL</button><button class="event-button" onclick="openEvent('halftime')">⏱️ HALBZEIT</button><button class="event-button" onclick="openEvent('final')">🏁 ABPFIFF</button><button class="event-button" onclick="startLiveMatch()">🔴 SPIEL STARTEN</button><button class="event-button" onclick="resetLiveMatch()">🔄 SPIEL ZURÜCKSETZEN</button></div>
<div id="eventForm" class="event-form"><label>Spielminute</label><input type="number" id="eventMinute" min="1" max="120" value="1"><label>Spieler</label><select id="player"><option value="">Bitte auswählen</option><option>Abu</option><option>Anouar</option><option>Aymen</option><option>Berthold Gorita</option><option>Denis</option><option>Eichinger</option><option>Emre</option><option>Eren</option><option>Flo</option><option>Hazem</option><option>Jolani</option><option>Rahyem</option><option>Kamil</option><option>Laza</option><option>Luis</option><option>Marcel</option><option>Metehan</option><option>Miguel</option><option>Onur</option><option>Senad</option><option>Tyrone</option><option>Wail</option><option>Wassim</option></select><label>Zusatzinfo</label><input type="text" id="eventText" placeholder="z.B. Kopfball, Freistoß..."><button class="publish-button" onclick="publishEvent()">🔴 EREIGNIS VERÖFFENTLICHEN</button></div></div>
<div class="ticker"><div class="ticker-title">Live-Ereignisse</div><div id="tickerEvents"></div></div><a href="index.html" class="back-button">← Zur Fanseite</a>
</div></div>
<script>
let selectedEvent="";const SUPABASE_URL="https://xmtrtpibldbiiikkkmnd.supabase.co";const SUPABASE_KEY="sb_publishable_5dbkLVYmSklCiPcjzzFk1g_ANJoqy9B";const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let currentMatch=null;
const ATSV_LOGO="bilder/ATSV_Wappen_4K_transparent.png";
function logoForTeam(team){const name=(team||"").trim().toLowerCase();if(name.includes("atsv"))return ATSV_LOGO;return ""}
function setTeamVisual(side,team){const logo=document.getElementById(side+"Logo"),placeholder=document.getElementById(side+"Placeholder"),name=document.getElementById(side+"Team");name.textContent=team||"";const src=logoForTeam(team);if(src){logo.src=src;logo.alt=team+" Wappen";logo.classList.remove("hidden");placeholder.classList.add("hidden")}else{logo.removeAttribute("src");logo.classList.add("hidden");placeholder.classList.remove("hidden")}}
function updateGoalButtons(){if(!currentMatch)return;const h=document.getElementById("homeGoalButton"),a=document.getElementById("awayGoalButton");const atsv=(currentMatch.home_team||"").toLowerCase().includes("atsv");if(atsv){h.textContent="⚽ TOR ATSV";a.textContent="⚽ TOR GEGNER"}else{h.textContent="⚽ TOR GEGNER";a.textContent="⚽ TOR ATSV"}}
function updateLiveBadge(){const b=document.getElementById("liveBadge");if(!currentMatch)return;if(currentMatch.status==="final"||currentMatch.status==="finished"){b.textContent="🏁 ABGEPFIFF";b.style.background="#444"}else if(currentMatch.status==="live"){b.textContent="LIVE";b.style.background="#d00020"}else{b.textContent="📅 VORBEREITET";b.style.background="#333"}}
async function loadActiveMatch(){let r=await supabaseClient.from("live_matches").select("*").eq("status","live").order("created_at",{ascending:false}).limit(1).maybeSingle();let data=r.data;if(!data){r=await supabaseClient.from("live_matches").select("*").eq("status","upcoming").order("created_at",{ascending:false}).limit(1).maybeSingle();data=r.data}if(r.error){console.error("Fehler beim Laden des Spiels:",r.error);return}if(!data){console.log("Kein Live- oder kommendes Spiel gefunden.");return}currentMatch=data;setTeamVisual("home",data.home_team);setTeamVisual("away",data.away_team);updateGoalButtons();updateLiveBadge();document.getElementById("homeScore").textContent=data.home_score??0;document.getElementById("awayScore").textContent=data.away_score??0;document.getElementById("currentMinute").textContent=data.current_minute??0;await loadLiveEvents(data.id)}
async function loadLiveEvents(matchId){const{data,error}=await supabaseClient.from("live_events").select("*").eq("match_id",matchId).order("created_at",{ascending:true});if(error){console.error("Fehler beim Laden der Live-Ereignisse:",error);return}const t=document.getElementById("tickerEvents");t.innerHTML="";for(const i of data){let m="";const atsv=(currentMatch.home_team||"").toLowerCase().includes("atsv");if(i.event_type==="homeGoal")m=(atsv?"⚽ TOR FÜR DEN ATSV! ":"⚽ TOR FÜR DEN GEGNER! ")+(i.player||"")+(i.description?" – "+i.description:"");else if(i.event_type==="awayGoal")m=atsv?"⚽ TOR FÜR DEN GEGNER!":"⚽ TOR FÜR DEN ATSV!";else if(i.event_type==="yellow")m="🟨 Gelbe Karte "+(i.player||"");else if(i.event_type==="red")m="🟥 Rote Karte "+(i.player||"");else if(i.event_type==="substitution")m="🔄 Wechsel "+(i.player||"");else if(i.event_type==="halftime")m="⏱️ Halbzeit";else if(i.event_type==="final")m="🏁 Abpfiff";else m=i.description||"Ereignis";const e=document.createElement("div");e.className="ticker-event";e.innerHTML='<span class="ticker-minute">'+i.minute+"'</span>"+m;t.prepend(e)}if(data.length===0&&currentMatch.status==="live")t.innerHTML='<div class="ticker-event"><span class="ticker-minute">1\'</span>Anpfiff – das Spiel läuft!</div>'}
function openEvent(type){selectedEvent=type;document.getElementById("eventForm").classList.add("active")}
async function loginAdmin(){const email=document.getElementById("adminEmail").value.trim(),password=document.getElementById("adminPassword").value,message=document.getElementById("loginMessage");if(!email||!password){message.textContent="Bitte E-Mail und Passwort eingeben.";return}const{error}=await supabaseClient.auth.signInWithPassword({email,password});if(error){console.error("Login-Fehler:",error);message.textContent="Anmeldung fehlgeschlagen.";return}document.getElementById("loginPanel").style.display="none";document.getElementById("adminPanel").style.display="block";message.textContent=""}
async function checkAdminSession(){const{data}=await supabaseClient.auth.getSession();if(data.session){document.getElementById("loginPanel").style.display="none";document.getElementById("adminPanel").style.display="block"}}checkAdminSession();
async function publishEvent(){if(!currentMatch){alert("Kein aktives Spiel gefunden.");return}const minute=Number(document.getElementById("eventMinute").value),player=document.getElementById("player").value,text=document.getElementById("eventText").value;let message="",newHomeScore=currentMatch.home_score??0,newAwayScore=currentMatch.away_score??0;const eventType=selectedEvent;if(eventType==="homeGoal"){newHomeScore++;const atsv=(currentMatch.home_team||"").toLowerCase().includes("atsv");message=(atsv?"⚽ TOR FÜR DEN ATSV! ":"⚽ TOR FÜR DEN GEGNER! ")+(player||"")+(text?" – "+text:"")}else if(eventType==="awayGoal"){newAwayScore++;const atsv=(currentMatch.home_team||"").toLowerCase().includes("atsv");message=atsv?"⚽ TOR FÜR DEN GEGNER!":"⚽ TOR FÜR DEN ATSV!"}else if(eventType==="yellow")message="🟨 Gelbe Karte "+(player||"");else if(eventType==="red")message="🟥 Rote Karte "+(player||"");else if(eventType==="substitution")message="🔄 Wechsel "+(player||"");else if(eventType==="halftime")message="⏱️ Halbzeit";else if(eventType==="final")message="🏁 Abpfiff";const{error:eventError}=await supabaseClient.from("live_events").insert({match_id:currentMatch.id,minute,event_type:eventType,player:player||null,description:text||null});if(eventError){alert("Das Ereignis konnte nicht gespeichert werden.");return}const update={home_score:newHomeScore,away_score:newAwayScore,current_minute:minute};if(eventType==="final")update.status="final";if(["homeGoal","awayGoal","final"].includes(eventType)){const{error}=await supabaseClient.from("live_matches").update(update).eq("id",currentMatch.id);if(error){alert("Der Spielstand bzw. Spielstatus konnte nicht gespeichert werden.");return}}Object.assign(currentMatch,update);document.getElementById("homeScore").textContent=newHomeScore;document.getElementById("awayScore").textContent=newAwayScore;document.getElementById("currentMinute").textContent=minute;updateLiveBadge();const e=document.createElement("div");e.className="ticker-event";e.innerHTML='<span class="ticker-minute">'+minute+"'</span>"+message;document.getElementById("tickerEvents").prepend(e);document.getElementById("eventForm").classList.remove("active");document.getElementById("eventText").value="";selectedEvent=""}
async function resetLiveMatch(){if(!currentMatch){alert("Kein aktives Spiel gefunden.");return}if(!confirm("Soll der Liveticker wirklich auf 0:0 zurückgesetzt werden?\n\nAlle bisherigen Ereignisse werden gelöscht."))return;const{error:ee}=await supabaseClient.from("live_events").delete().eq("match_id",currentMatch.id);if(ee){alert("Die Ereignisse konnten nicht gelöscht werden.");return}const{error}=await supabaseClient.from("live_matches").update({home_score:0,away_score:0,current_minute:1,status:"live"}).eq("id",currentMatch.id);if(error){alert("Der Spielstand konnte nicht zurückgesetzt werden.");return}currentMatch.home_score=0;currentMatch.away_score=0;currentMatch.current_minute=1;currentMatch.status="live";document.getElementById("homeScore").textContent="0";document.getElementById("awayScore").textContent="0";document.getElementById("currentMinute").textContent="1";updateLiveBadge();document.getElementById("tickerEvents").innerHTML='<div class="ticker-event"><span class="ticker-minute">1\'</span>Anpfiff – das Spiel läuft!</div>';document.getElementById("eventForm").classList.remove("active");document.getElementById("eventText").value="";document.getElementById("eventMinute").value=1;selectedEvent=""}
async function startLiveMatch(){if(!currentMatch||["final","finished"].includes(currentMatch.status)){const{data,error}=await supabaseClient.from("live_matches").select("*").eq("status","upcoming").order("created_at",{ascending:false}).limit(1).single();if(error||!data){alert("Kein geplantes Spiel gefunden.");return}currentMatch=data;setTeamVisual("home",data.home_team);setTeamVisual("away",data.away_team);updateGoalButtons()}if(!confirm("Soll das Spiel jetzt gestartet werden?\n\nDer Liveticker wird auf LIVE und 0:0 gesetzt."))return;const{error}=await supabaseClient.from("live_matches").update({status:"live",home_score:0,away_score:0,current_minute:1}).eq("id",currentMatch.id);if(error){alert("Das Spiel konnte nicht gestartet werden.");return}currentMatch.status="live";currentMatch.home_score=0;currentMatch.away_score=0;currentMatch.current_minute=1;document.getElementById("homeScore").textContent="0";document.getElementById("awayScore").textContent="0";document.getElementById("currentMinute").textContent="1";updateLiveBadge();document.getElementById("tickerEvents").innerHTML='<div class="ticker-event"><span class="ticker-minute">1\'</span>Anpfiff – das Spiel läuft!</div>';alert("Das Spiel ist jetzt LIVE!")}
async function publishNews(){const title=document.getElementById("newsTitle").value.trim(),text=document.getElementById("newsText").value.trim(),date=document.getElementById("newsDate").value,message=document.getElementById("newsMessage");if(!title||!text||!date){message.textContent="Bitte Überschrift, Nachricht und Datum ausfüllen.";return}const{error}=await supabaseClient.from("news").insert({title,text,date});if(error){message.textContent="Die News konnte nicht gespeichert werden.";return}message.textContent="✅ News wurde veröffentlicht.";document.getElementById("newsTitle").value="";document.getElementById("newsText").value="";document.getElementById("newsDate").value=""}
loadActiveMatch();
</script>
</body>
</html>
