<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ATSV Live-Ticker</title>
<style>
body{margin:0;background:#090909;color:#fff;font-family:Arial,Helvetica,sans-serif}.live-page{min-height:100vh;padding:30px 20px 100px;background:linear-gradient(135deg,#090909,#151515 65%,#250b0b)}.live-container{width:min(700px,100%);margin:auto}.live-title{text-align:center;color:#d00020;font-weight:900;letter-spacing:4px;text-transform:uppercase}.live-subtitle{text-align:center;color:#aaa;margin:10px 0 25px}.score-card,.admin-card{background:#111;border:2px solid #d00020;border-radius:16px;padding:22px;text-align:center;box-shadow:0 0 25px rgba(208,0,32,.22)}.live-badge{display:inline-block;background:#333;padding:8px 16px;border-radius:20px;font-size:12px;font-weight:900;letter-spacing:2px;margin-bottom:18px}.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}.team-box{display:flex;flex-direction:column;align-items:center;gap:8px}.team{font-size:20px;font-weight:900}.team-logo,.team-placeholder{width:70px;height:70px;object-fit:contain}.team-placeholder{display:flex;align-items:center;justify-content:center;color:#777;font-size:38px}.hidden{display:none!important}.score{font-size:48px;font-weight:900;color:#d00020}.minute{margin-top:10px;color:#aaa}.admin-card{margin-top:24px;border:1px solid #333;text-align:left;box-shadow:none}.admin-title{color:#d00020;font-weight:900;letter-spacing:2px;margin-bottom:14px}.admin-card input,.admin-card select{width:100%;box-sizing:border-box;padding:13px;margin:5px 0;background:#080808;color:#fff;border:1px solid #444;border-radius:8px;font-size:16px}.publish-button,.event-button{border:0;border-radius:9px;font-weight:900;cursor:pointer}.publish-button{width:100%;margin-top:15px;padding:14px;background:#d00020;color:#fff}.event-buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.event-button{background:#181818;color:#fff;border:1px solid #444;padding:15px 8px}.event-form{display:none;margin-top:18px;padding-top:18px;border-top:1px solid #333}.event-form.active{display:block}.event-form label{display:block;color:#aaa;font-size:13px;margin:10px 0 5px}.ticker{margin-top:25px}.ticker-title{color:#d00020;font-weight:900;letter-spacing:2px;margin-bottom:12px}.ticker-event{background:#111;border-left:4px solid #d00020;padding:13px;margin-bottom:8px;border-radius:0 8px 8px 0}.ticker-minute{color:#d00020;font-weight:900;margin-right:8px}.back-button{display:block;width:max-content;margin:25px auto;color:#fff;text-decoration:none;border:1px solid #444;padding:11px 18px;font-weight:800}.status-message{margin-top:10px;color:#aaa;font-size:14px;text-align:center}.match-info{margin:12px 0;color:#aaa;font-size:14px;text-align:center}.danger{background:#6b0010}.success{background:#0b5d2a!important}@media(max-width:600px){.live-page{padding:20px 12px 100px}.team{font-size:15px}.team-logo,.team-placeholder{width:58px;height:58px}.score{font-size:40px}.event-buttons{grid-template-columns:1fr}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="live-page"><div class="live-container">
<div class="live-title">ATSV Forchheim</div><div class="live-subtitle">🔴 Live-Ticker</div>
<div class="score-card"><div class="live-badge" id="liveBadge">KEIN SPIEL</div><div class="teams">
<div class="team-box"><img id="homeLogo" class="team-logo hidden" alt=""><div id="homePlaceholder" class="team-placeholder">⚽</div><div id="homeTeam" class="team">ATSV Forchheim</div></div>
<div class="score"><span id="homeScore">–</span> : <span id="awayScore">–</span></div>
<div class="team-box"><img id="awayLogo" class="team-logo hidden" alt=""><div id="awayPlaceholder" class="team-placeholder">⚽</div><div id="awayTeam" class="team">Gegner</div></div>
</div><div class="minute">Spielminute: <strong id="currentMinute">-</strong>'</div><div id="matchInfo" class="match-info"></div></div>
<div class="admin-card" id="loginPanel"><div class="admin-title">🔐 Admin-Anmeldung</div><input type="email" id="adminEmail" placeholder="E-Mail"><input type="password" id="adminPassword" placeholder="Passwort"><button class="publish-button" onclick="loginAdmin()">🔐 ANMELDEN</button><div id="loginMessage" class="status-message"></div></div>
<div class="admin-card" id="adminPanel" style="display:none"><div class="admin-title">🔐 ATSV Live-Eingabe</div>
<div class="event-buttons"><button id="homeGoalButton" class="event-button" onclick="openEvent('homeGoal')">⚽ TOR HEIMTEAM</button><button id="awayGoalButton" class="event-button" onclick="openEvent('awayGoal')">⚽ TOR GASTTEAM</button><button class="event-button" onclick="openEvent('yellow')">🟨 GELBE KARTE</button><button class="event-button" onclick="openEvent('red')">🟥 ROTE KARTE</button><button class="event-button" onclick="openEvent('substitution')">🔄 WECHSEL</button><button class="event-button" onclick="openEvent('halftime')">⏱️ HALBZEIT</button><button class="event-button" onclick="openEvent('final')">🏁 ABPFIFF</button><button id="startButton" class="event-button success" onclick="startLiveMatch()">🔴 SPIEL STARTEN</button><button class="event-button danger" onclick="resetLiveMatch()">🔄 SPIEL ZURÜCKSETZEN</button></div>
<div id="eventForm" class="event-form"><label>Spielminute</label><input type="number" id="eventMinute" min="1" max="120" value="1"><label>Spieler</label><select id="player"><option value="">Bitte auswählen</option><option>Abu</option><option>Anouar</option><option>Aymen</option><option>Berthold Gorita</option><option>Denis</option><option>Eichinger</option><option>Emre</option><option>Eren</option><option>Flo</option><option>Hazem</option><option>Jolani</option><option>Rahyem</option><option>Kamil</option><option>Laza</option><option>Luis</option><option>Marcel</option><option>Metehan</option><option>Miguel</option><option>Onur</option><option>Senad</option><option>Tyrone</option><option>Wail</option><option>Wassim</option></select><label>Zusatzinfo</label><input type="text" id="eventText" placeholder="z.B. Kopfball, Freistoß..."><button class="publish-button" onclick="publishEvent()">🔴 EREIGNIS VERÖFFENTLICHEN</button></div>
<a href="admin-push.html" class="publish-button" style="display:block;text-align:center;text-decoration:none;box-sizing:border-box">🔔 ATSV PUSH-ZENTRALE</a></div>
<div class="ticker"><div class="ticker-title">Live-Ereignisse</div><div id="tickerEvents"></div></div><a href="index.html" class="back-button">← Zur Fanseite</a>
</div></div>
<script>
let selectedEvent="",currentMatch=null;
const SUPABASE_URL="https://xmtrtpibldbiiikkkmnd.supabase.co",SUPABASE_KEY="sb_publishable_5dbkLVYmSklCiPcjzzFk1g_ANJoqy9B";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),ATSV_LOGO="bilder/ATSV_Wappen_4K_transparent.png";
function logoForTeam(t){return(t||"").toLowerCase().includes("atsv")?ATSV_LOGO:""}
function setTeamVisual(side,team){const l=document.getElementById(side+"Logo"),p=document.getElementById(side+"Placeholder");document.getElementById(side+"Team").textContent=team||"Gegner";const s=logoForTeam(team);if(s){l.src=s;l.classList.remove("hidden");p.classList.add("hidden")}else{l.classList.add("hidden");p.classList.remove("hidden")}}
function updateGoalButtons(){if(!currentMatch)return;const a=(currentMatch.home_team||"").toLowerCase().includes("atsv");document.getElementById("homeGoalButton").textContent=a?"⚽ TOR ATSV":"⚽ TOR GEGNER";document.getElementById("awayGoalButton").textContent=a?"⚽ TOR GEGNER":"⚽ TOR ATSV"}
function updateLiveBadge(){const b=document.getElementById("liveBadge"),s=currentMatch?.status;if(!currentMatch){b.textContent="KEIN SPIEL";b.style.background="#333"}else if(s==="live"){b.textContent="LIVE";b.style.background="#d00020"}else if(["final","finished"].includes(s)){b.textContent="🏁 ABGEPFIFF";b.style.background="#444"}else{b.textContent="📅 VORBEREITET";b.style.background="#333"}}
function calculatedLiveMinute(m){if(!m||m.status!=="live")return m?.current_minute??1;const start=m.live_started_at||m.updated_at||m.created_at;if(!start)return m.current_minute??1;return Math.max(1,Math.floor((Date.now()-new Date(start).getTime())/60000)+1)}
function updateScreen(){if(!currentMatch){document.getElementById("homeScore").textContent="–";document.getElementById("awayScore").textContent="–";document.getElementById("currentMinute").textContent="-";document.getElementById("matchInfo").textContent="Kein Spiel ausgewählt";updateLiveBadge();document.getElementById("tickerEvents").innerHTML="";return}setTeamVisual("home",currentMatch.home_team);setTeamVisual("away",currentMatch.away_team);updateGoalButtons();updateLiveBadge();document.getElementById("homeScore").textContent=currentMatch.home_score??0;document.getElementById("awayScore").textContent=currentMatch.away_score??0;document.getElementById("currentMinute").textContent=calculatedLiveMinute(currentMatch);document.getElementById("matchInfo").textContent=(currentMatch.status==="live"?"Dieses Spiel ist live":"Dieses Spiel ist vorbereitet");loadLiveEvents(currentMatch.id)}
async function loadActiveMatch(){try{let r=await supabaseClient.from("live_matches").select("*").eq("status","live").order("created_at",{ascending:false}).limit(1).maybeSingle();if(r.error)throw r.error;let d=r.data;if(!d){r=await supabaseClient.from("live_matches").select("*").eq("status","upcoming").order("created_at",{ascending:false}).limit(1).maybeSingle();if(r.error)throw r.error;d=r.data}currentMatch=d||null;updateScreen()}catch(e){console.error(e);document.getElementById("matchInfo").textContent="Fehler beim Laden des Spiels"}}
async function loadLiveEvents(id){const{data,error}=await supabaseClient.from("live_events").select("*").eq("match_id",id).order("created_at",{ascending:true});if(error){console.error(error);return}const t=document.getElementById("tickerEvents");t.innerHTML="";for(const i of(data||[])){let m=i.description||"Ereignis";const atsv=(currentMatch.home_team||"").toLowerCase().includes("atsv");if(i.event_type==="homeGoal")m=(atsv?"⚽ TOR FÜR DEN ATSV! ":"⚽ TOR FÜR DEN GEGNER! ")+(i.player||"")+(i.description?" – "+i.description:"");else if(i.event_type==="awayGoal")m=(atsv?"⚽ TOR FÜR DEN GEGNER! ":"⚽ TOR FÜR DEN ATSV! ")+(i.player||"")+(i.description?" – "+i.description:"");else if(i.event_type==="yellow")m="🟨 Gelbe Karte "+(i.player||"");else if(i.event_type==="red")m="🟥 Rote Karte "+(i.player||"");else if(i.event_type==="substitution")m="🔄 Wechsel "+(i.player||"");else if(i.event_type==="halftime")m="⏱️ Halbzeit";else if(i.event_type==="final")m="🏁 Abpfiff";const e=document.createElement("div");e.className="ticker-event";e.innerHTML='<span class="ticker-minute">'+i.minute+"'</span>"+m;t.prepend(e)}if(!(data||[]).length&&currentMatch.status==="live")t.innerHTML='<div class="ticker-event"><span class="ticker-minute">1\'</span>Anpfiff – das Spiel läuft!</div>'}
function openEvent(t){selectedEvent=t;document.getElementById("eventForm").classList.add("active")}
async function loginAdmin(){const email=document.getElementById("adminEmail").value.trim(),password=document.getElementById("adminPassword").value;if(!email||!password){document.getElementById("loginMessage").textContent="Bitte E-Mail und Passwort eingeben.";return}const{error}=await supabaseClient.auth.signInWithPassword({email,password});if(error){console.error(error);document.getElementById("loginMessage").textContent="Anmeldung fehlgeschlagen.";return}document.getElementById("loginPanel").style.display="none";document.getElementById("adminPanel").style.display="block";await loadActiveMatch()}
async function checkAdminSession(){const{data}=await supabaseClient.auth.getSession();if(data.session){document.getElementById("loginPanel").style.display="none";document.getElementById("adminPanel").style.display="block";await loadActiveMatch()}}checkAdminSession();setInterval(loadActiveMatch,10000);setInterval(loadActiveMatch,10000);setInterval(()=>{if(currentMatch?.status==="live")updateScreen();else loadActiveMatch()},10000);
async function startLiveMatch(){const b=document.getElementById("startButton");b.disabled=true;b.textContent="⏳ WIRD GESTARTET...";try{let d=null;let r=await supabaseClient.from("live_matches").select("*").eq("status","upcoming").order("created_at",{ascending:false}).limit(1).maybeSingle();if(r.error)throw r.error;d=r.data;if(!d&&currentMatch?.status==="live"){alert("Dieses Spiel läuft bereits LIVE.");return}if(!d){const opponent=prompt("Gegner eingeben:","Gegner");if(!opponent||!opponent.trim())return;const ins=await supabaseClient.from("live_matches").insert({home_team:"ATSV Forchheim",away_team:opponent.trim(),home_score:0,away_score:0,current_minute:1,status:"live",live_started_at:new Date().toISOString()}).select().single();if(ins.error)throw ins.error;d=ins.data}else{const up=await supabaseClient.from("live_matches").update({status:"live",home_score:0,away_score:0,current_minute:1,live_started_at:new Date().toISOString(),live_started_at:new Date().toISOString(),live_started_at:new Date().toISOString()}).eq("id",d.id).select().single();if(up.error)throw up.error;d=up.data}currentMatch=d;updateScreen();alert("Das Spiel ist jetzt LIVE!")}catch(e){console.error(e);alert("Das Spiel konnte nicht gestartet werden. Bitte Admin-Anmeldung und Supabase-Berechtigung prüfen.")}finally{b.disabled=false;b.textContent="🔴 SPIEL STARTEN"}}
async function publishEvent(){if(!currentMatch||currentMatch.status!=="live"){alert("Kein laufendes Spiel. Bitte zuerst SPIEL STARTEN.");return}const minute=Number(document.getElementById("eventMinute").value),player=document.getElementById("player").value,text=document.getElementById("eventText").value;let h=currentMatch.home_score??0,a=currentMatch.away_score??0;if(selectedEvent==="homeGoal")h++;if(selectedEvent==="awayGoal")a++;const{error:e}=await supabaseClient.from("live_events").insert({match_id:currentMatch.id,minute,event_type:selectedEvent,player:player||null,description:text||null});if(e){console.error(e);alert("Das Ereignis konnte nicht gespeichert werden.");return}const update={home_score:h,away_score:a,current_minute:minute};if(selectedEvent==="final"){update.status="final";update.live_started_at=null}if(["homeGoal","awayGoal","final"].includes(selectedEvent)){const{error}=await supabaseClient.from("live_matches").update(update).eq("id",currentMatch.id);if(error){console.error(error);alert("Der Spielstand konnte nicht gespeichert werden.");return}}Object.assign(currentMatch,update);updateScreen();document.getElementById("eventForm").classList.remove("active");selectedEvent=""}
async function resetLiveMatch(){if(!currentMatch){alert("Kein Spiel vorhanden.");return}if(!confirm("Das aktuelle Spiel wirklich zurücksetzen? Spielstand und Live-Ereignisse werden gelöscht."))return;try{const{error:e}=await supabaseClient.from("live_events").delete().eq("match_id",currentMatch.id);if(e)throw e;const{error}=await supabaseClient.from("live_matches").update({status:"upcoming",home_score:0,away_score:0,current_minute:1,live_started_at:null}).eq("id",currentMatch.id);if(error)throw error;await loadActiveMatch();alert("Das Spiel wurde zurückgesetzt.")}catch(e){console.error(e);alert("Das Spiel konnte nicht zurückgesetzt werden.")}}
</script>
</body>
</html>
